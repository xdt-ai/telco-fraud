bundle:
  name: telco-fraud

variables:
  catalog:
    description: Unity Catalog catalog (use one you own, e.g. "workspace", if you can't create catalogs)
    default: telco_fraud
  schema:
    default: fraud
  warehouse_id:
    description: SQL warehouse the app queries (Compute → SQL Warehouses → copy ID)
  llm_endpoint:
    description: Chat model serving endpoint for the AI investigation agent
    default: databricks-meta-llama-3-3-70b-instruct
  notify_email:
    default: you@example.com

include: []

resources:
  jobs:
    fraud_pipeline:
      name: telco-fraud-pipeline
      email_notifications:
        on_failure: [ "${var.notify_email}" ]
      parameters:
        - { name: catalog, default: "${var.catalog}" }
        - { name: schema,  default: "${var.schema}" }
      tasks:
        - task_key: setup
          notebook_task: { notebook_path: ./notebooks/00_setup.py }
        - task_key: generate_data
          depends_on: [ { task_key: setup } ]
          notebook_task: { notebook_path: ./notebooks/01_generate_data.py }
        - task_key: bronze_silver
          depends_on: [ { task_key: generate_data } ]
          notebook_task: { notebook_path: ./notebooks/02_bronze_silver.py }
        - task_key: gold_risk_engine
          depends_on: [ { task_key: bronze_silver } ]
          notebook_task: { notebook_path: ./notebooks/03_gold_risk_engine.py }
        - task_key: train_score_model
          depends_on: [ { task_key: gold_risk_engine } ]
          notebook_task: { notebook_path: ./notebooks/04_train_score_model.py }
        - task_key: cases_and_kpis
          depends_on: [ { task_key: train_score_model } ]
          notebook_task: { notebook_path: ./notebooks/05_cases_and_kpis.py }
        - task_key: monitoring
          depends_on: [ { task_key: cases_and_kpis } ]
          notebook_task: { notebook_path: ./notebooks/06_monitoring.py }

  apps:
    fraud_workbench:
      name: telco-fraud-workbench
      description: Fraud analyst workbench (executive / management / analyst views + AI agent)
      source_code_path: ./app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: llm
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY

targets:
  dev:
    mode: development
    default: true
